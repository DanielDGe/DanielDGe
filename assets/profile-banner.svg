<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Daniel García — Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="50%" stop-color="#0d223d"/>
      <stop offset="100%" stop-color="#0a66c2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4da3ff" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#4da3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="22" fill="url(#bg)"/>

  <g opacity="0.24" stroke="#74b9ff" stroke-width="1">
    <path d="M0 55 H1200"/>
    <path d="M0 130 H1200"/>
    <path d="M0 205 H1200"/>
    <path d="M155 0 V260"/>
    <path d="M355 0 V260"/>
    <path d="M555 0 V260"/>
    <path d="M755 0 V260"/>
    <path d="M955 0 V260"/>
  </g>

  <circle cx="950" cy="130" r="175" fill="url(#glow)" filter="url(#softGlow)">
    <animate attributeName="r" values="145;190;145" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.9;0.55" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g fill="none" stroke="#65b8ff" stroke-width="2" opacity="0.7">
    <path d="M720 56 C810 20 885 92 960 60 S1105 48 1180 82">
      <animate attributeName="stroke-opacity" values="0.25;0.95;0.25" dur="4.8s" repeatCount="indefinite"/>
    </path>
    <path d="M700 195 C800 235 900 162 1000 195 S1110 225 1190 182">
      <animate attributeName="stroke-opacity" values="0.85;0.25;0.85" dur="5.6s" repeatCount="indefinite"/>
    </path>
    <path d="M815 20 L875 82 L960 50 L1035 112 L1110 68" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" values="0;-32" dur="2.7s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#8ecaff">
    <circle cx="815" cy="20" r="5"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="875" cy="82" r="5"><animate attributeName="opacity" values="1;0.25;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="50" r="5"><animate attributeName="r" values="4;8;4" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1035" cy="112" r="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="68" r="5"><animate attributeName="r" values="4;7;4" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(72 72)">
    <text x="0" y="0" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="39" font-weight="700">Daniel García</text>
    <text x="0" y="48" fill="#b9d9ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="500">Software Engineer · Full-Stack Developer</text>
    <text x="0" y="84" fill="#83bfff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18">Architecture · Systems Integration · APIs · Distributed Systems</text>
  </g>

  <g transform="translate(738 151)">
    <rect x="0" y="0" width="365" height="60" rx="15" fill="#07101d" fill-opacity="0.62" stroke="#4aa3ff" stroke-opacity="0.5"/>
    <circle cx="31" cy="30" r="7" fill="#35d07f">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <text x="51" y="25" fill="#dceeff" font-family="Consolas, Menlo, monospace" font-size="14">building reliable software</text>
    <text x="51" y="44" fill="#75baff" font-family="Consolas, Menlo, monospace" font-size="12">backend · frontend · integration</text>
  </g>

  <rect x="-240" y="0" width="180" height="260" fill="#ffffff" opacity="0.035" transform="skewX(-20)">
    <animate attributeName="x" values="-240;1400" dur="7.5s" repeatCount="indefinite"/>
  </rect>
</svg>
