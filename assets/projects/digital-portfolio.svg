  <text x="40" y="140" fill="#e8def4" font-family="Segoe UI,Arial,sans-serif" font-size="18">Academic web application for organizing evidence,</text>
  <text x="40" y="166" fill="#e8def4" font-family="Segoe UI,Arial,sans-serif" font-size="18">assessment activities and interactive learning content.</text>
