      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#271543"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
