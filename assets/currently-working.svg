  <text x="40" y="145" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="17">Real-time fleet monitoring · telemetry · event-driven processing · observability</text>

  <g font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">
    <rect x="690" y="46" width="108" height="32" rx="16" fill="#17213d"/>
