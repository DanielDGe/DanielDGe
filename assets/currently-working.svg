  </defs>

  <rect width="1100" height="180" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1098" height="178" rx="21" fill="none" stroke="#28445c"/>
  <rect x="5" y="24" width="6" height="132" rx="3" fill="url(#accent)"/>

  <circle cx="62" cy="62" r="9" fill="#22c55e">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
