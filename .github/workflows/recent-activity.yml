name: Update recent activity

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/recent-activity.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Build recent public activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          PROFILE_REPOS: "DanielDGe/01-task-manager,DanielDGe/danieldge.github.io,DanielDGe/portafolio-evaluacion-superior"
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          username = os.environ["GH_USER"]
          token = os.environ["GH_TOKEN"]
          allowed_repos = {
              repo.strip()
              for repo in os.environ["PROFILE_REPOS"].split(",")
              if repo.strip()
          }

          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(days=365)

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": f"{username}-profile-readme",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api_get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          def parse_date(value):
              try:
                  return datetime.fromisoformat(value.replace("Z", "+00:00")).astimezone(timezone.utc)
              except Exception:
                  return None

          def format_date(value):
              return value.strftime("%b %d, %Y")

          candidates = []
          seen = set()

          # 1) Public GitHub events from selected profile repositories only.
          events = api_get(
              f"https://api.github.com/users/{username}/events/public?per_page=100"
          )

          for event in events:
              event_type = event.get("type", "")
              repo = event.get("repo", {}).get("name", "")
              payload = event.get("payload", {})
              event_date = parse_date(event.get("created_at", ""))

              if repo not in allowed_repos or not event_date or event_date < cutoff:
                  continue

              repo_url = f"https://github.com/{repo}"
              line = None

              if event_type == "PushEvent":
                  commits = payload.get("commits", [])
                  count = len(commits)
                  if count:
                      label = "commit" if count == 1 else "commits"
                      line = f"💻 Pushed **{count} {label}** to [{repo}]({repo_url})"

              elif event_type == "PullRequestEvent":
                  action = payload.get("action", "")
                  pr = payload.get("pull_request", {})
                  number = pr.get("number")
                  url = pr.get("html_url")
                  title = pr.get("title", "pull request")
                  if action in {"opened", "reopened"} and url:
                      line = f"🔀 Opened PR [#{number} — {title}]({url}) in [{repo}]({repo_url})"
                  elif action == "closed" and url:
                      verb = "Merged" if pr.get("merged") else "Closed"
                      line = f"🔀 {verb} PR [#{number} — {title}]({url}) in [{repo}]({repo_url})"

              elif event_type == "CreateEvent":
                  ref_type = payload.get("ref_type")
                  ref = payload.get("ref")
                  if ref_type == "repository":
                      line = f"✨ Created repository [{repo}]({repo_url})"
                  elif ref_type == "branch" and ref:
                      line = f"🌿 Created branch **{ref}** in [{repo}]({repo_url})"

              elif event_type == "ReleaseEvent":
                  release = payload.get("release", {})
                  tag = release.get("tag_name")
                  url = release.get("html_url", repo_url)
                  if tag:
                      line = f"🚀 Published release [{tag}]({url}) in [{repo}]({repo_url})"

              elif event_type == "IssuesEvent":
                  action = payload.get("action", "")
                  issue = payload.get("issue", {})
                  if action == "opened" and issue.get("html_url"):
                      line = f"🧩 Opened issue [#{issue.get('number')} — {issue.get('title', 'issue')}]({issue.get('html_url')}) in [{repo}]({repo_url})"

              if not line:
                  continue

              key = (event_type, repo, line)
              if key in seen:
                  continue

              seen.add(key)
              candidates.append({
                  "date": event_date,
                  "line": f"- {line} <sub>· {format_date(event_date)}</sub>",
              })

          # 2) Add the latest authored commit from each selected repo as fallback/context.
          encoded_author = urllib.parse.quote(username)

          for full_name in sorted(allowed_repos):
              commits = api_get(
                  f"https://api.github.com/repos/{full_name}/commits?author={encoded_author}&per_page=1"
              )

              if not commits:
                  continue

              commit = commits[0]
              sha = commit.get("sha", "")
              html_url = commit.get("html_url")
              message = (
                  commit.get("commit", {})
                  .get("message", "commit")
                  .splitlines()[0]
                  .strip()
              )
              commit_date = parse_date(
                  commit.get("commit", {})
                  .get("author", {})
                  .get("date", "")
              )

              if not commit_date or commit_date < cutoff or not html_url:
                  continue

              if len(message) > 72:
                  message = message[:69] + "..."

              key = ("commit", full_name, sha)
              if key in seen:
                  continue

              seen.add(key)
              candidates.append({
                  "date": commit_date,
                  "line": (
                      f"- 🧱 Latest commit in [{full_name}](https://github.com/{full_name}): "
                      f"[{message}]({html_url}) <sub>· {format_date(commit_date)}</sub>"
                  ),
              })

          # Newest first, then keep only the five most relevant recent items.
          candidates.sort(key=lambda item: item["date"], reverse=True)
          activity = [item["line"] for item in candidates[:5]]

          if not activity:
              activity = ["- No activity from selected public projects in the last 12 months."]

          readme_path = "README.md"
          with open(readme_path, "r", encoding="utf-8") as file:
              readme = file.read()

          replacement = (
              "<!--RECENT_ACTIVITY:start-->\n"
              + "\n".join(activity)
              + "\n<!--RECENT_ACTIVITY:end-->"
          )

          updated, count = re.subn(
              r"<!--RECENT_ACTIVITY:start-->.*?<!--RECENT_ACTIVITY:end-->",
              replacement,
              readme,
              flags=re.DOTALL,
          )

          if count != 1:
              raise SystemExit("Recent activity markers were not found exactly once.")

          with open(readme_path, "w", encoding="utf-8") as file:
              file.write(updated)
          PY

      - name: Commit activity update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No activity changes."
          else
            git commit -m "chore: refresh selected recent activity"
            git push
          fi
